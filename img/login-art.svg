    <line x1="230" y1="14" x2="230" y2="116" stroke="#14524F" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="30" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1C2321" font-weight="700">ADMIT ONE</text>
